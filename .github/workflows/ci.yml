name: Build And Test
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_package:
        description: Publish ESbirka.Client to GitHub Packages after verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ESbirka.slnx -c Release --logger trx
      - run: dotnet pack src/ESbirka.Client/ESbirka.Client.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: ESbirka.Client
          path: artifacts/*.nupkg
          if-no-files-found: error

  binary-packages:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: ESbirka.Mcp-linux-x64.tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive: ESbirka.Mcp-linux-arm64.tar.gz
          - os: windows-latest
            rid: win-x64
            archive: ESbirka.Mcp-win-x64.zip
          - os: windows-latest
            rid: win-arm64
            archive: ESbirka.Mcp-win-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish src/ESbirka.Mcp/ESbirka.Mcp.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/${{ matrix.rid }}
      - name: Archive Linux binary
        if: runner.os == 'Linux'
        run: tar -czf artifacts/${{ matrix.archive }} -C artifacts/${{ matrix.rid }} .
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath artifacts/${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ESbirka.Mcp-${{ matrix.rid }}
          path: artifacts/${{ matrix.archive }}
          if-no-files-found: error

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --output type=oci,dest=/tmp/esbirka-mcp-arm64.tar .
      - name: Build and start AMD64 image
        run: docker compose up -d --build
      - name: Initialize MCP over HTTP
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              http://127.0.0.1:3001/mcp | grep --quiet 'serverInfo'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: [test, container]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_package &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-client-package
      cancel-in-progress: false
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ESbirka.Client
          path: artifacts
      - name: Publish to GitHub Packages
        env:
          PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          NUGET_AUTH_TOKEN: ${{ github.token }}
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
        run: |
          dotnet nuget add source "$PACKAGE_SOURCE" --name github
          dotnet nuget push "artifacts/*.nupkg" --source github --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate
        shell: bash
